[project]
name = "dialux-mcp-server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rafael Cruz", email = "185978906+rafaelcruzmartins@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9",
